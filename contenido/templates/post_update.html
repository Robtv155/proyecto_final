{% extends 'blog.html' %}
{% block title %} Editar un Post {% endblock %}

{% block content %}
  <h2>Edita un Post</h2>

  {% if object.image %}
    <p>Imagen actual:</p>
    <img src="{{ object.image.url }}" alt="Imagen actual" style="max-width: 400px; height: auto; border-radius: 8px;">
  {% else %}
    <p>No hay imagen asociada a este post.</p>
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Edita</button>
  </form>

  <br>
  <a href="{% url 'post_detail' object.pk %}">Cancelar</a>
{% endblock %}
