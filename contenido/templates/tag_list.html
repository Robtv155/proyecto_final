{% extends 'blog.html' %}
{% block title %}Lista de Tags{% endblock %}

{% block content %}
<h1 class="titulo">Lista de Tags</h1>
<a href="{% url 'post_list' %}">← Volver a la lista de posts</a>
<br><br>

<div class="tag-container">
  {% for tag in object_list %}
    <span class="tag">
      <a href="{% url 'post_list_by_tag' tag.pk %}" class="tag-link">
        {{ tag.name }}
      </a>
      <a href="{% url 'tag_delete' tag.pk %}" class="tag-remove" title="Eliminar tag">×</a>
    </span>
  {% empty %}
    <p>No hay tags disponibles.</p>
  {% endfor %}
</div>

<br>
<a href="{% url 'tag_create' %}" class="boton">Crea un nuevo tag</a>
{% endblock %}
